<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bfe6ff">
<title>단어 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --sky1:#b9e3ff; --sky2:#e9f7ff; --ink:#4b3f63; --ink2:#7a6f8f;
  --pink:#ff8fb8; --pink2:#ffe0ec; --yellow:#ffd96a; --yellow2:#fff4cc;
  --mint:#6fd6b4; --mint2:#dcf8ef; --blue:#5fb0ef; --blue2:#dff0ff;
  --card:#ffffff; --line:#e7eef7;
  --shadow:0 6px 0 rgba(95,176,239,.22),0 14px 30px rgba(70,130,190,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Jua',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,#d3eeff 50%,var(--sky2) 100%) fixed;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
.en{font-family:'Fredoka','Jua',sans-serif}
img.emoji{height:1em;width:1em;margin:0 .04em;vertical-align:-.12em}
.duo{display:inline-flex;align-items:center;gap:.02em;font-size:.66em;line-height:1;vertical-align:middle;white-space:nowrap}
.duo img.emoji{margin:0}

/* ===== sky ===== */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;left:0;height:44px;background:#fff;border-radius:60px;
  box-shadow:0 6px 0 rgba(255,255,255,.5);animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:52%;height:150%;left:14%;top:-62%}
.cloud::after{width:40%;height:120%;right:12%;top:-42%}
.cloud i{position:absolute;z-index:2;top:46%;left:40%;width:5px;height:7px;border-radius:50%;background:#7b6c8f;
  box-shadow:16px 0 0 #7b6c8f}
.cloud b{position:absolute;z-index:2;top:62%;left:32%;width:9px;height:5px;border-radius:50%;background:#ffc3d8;
  box-shadow:31px 0 0 #ffc3d8}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(calc(100vw + 60px))}}
.sparkle{position:absolute;color:#fff;font-size:14px;animation:twinkle 3s ease-in-out infinite;opacity:.8}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}

/* ===== layout ===== */
#app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px 16px 60px}
.topbar{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.back{background:#fff;border-radius:999px;padding:9px 16px;font-size:16px;box-shadow:var(--shadow)}
.back:active{transform:translateY(3px)}
.topbar .t{flex:1;font-size:22px;text-align:center}
.topbar .r{min-width:70px;text-align:right;font-size:19px;color:var(--ink2)}

.panel{background:rgba(255,255,255,.92);border-radius:28px;padding:18px;box-shadow:var(--shadow);margin:14px 0;border:3px solid #fff}
h2{font-size:21px;margin:26px 4px 10px;font-weight:400}
.muted{color:var(--ink2)}

/* hero */
.hero{display:flex;align-items:flex-end;gap:6px;margin-top:6px}
.catwrap{width:150px;flex:none}
.catwrap svg{width:100%;display:block}
.bubble{position:relative;background:#fff;border-radius:24px;padding:14px 16px;font-size:17px;line-height:1.45;
  box-shadow:var(--shadow);margin-bottom:48px;flex:1}
.bubble::after{content:'';position:absolute;left:-12px;bottom:18px;border:10px solid transparent;border-right:14px solid #fff;border-left:0}
.title{font-size:34px;text-align:center;margin:8px 0 2px;font-weight:400;letter-spacing:1px;
  color:#fff;text-shadow:0 3px 0 #5fb0ef,0 6px 14px rgba(60,120,190,.35)}
.title .en{font-weight:700}
.subtitle{text-align:center;color:#5a7fa6;font-size:15px;margin-bottom:6px}

/* plan */
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.plan div{background:var(--blue2);border-radius:18px;padding:10px 6px;text-align:center;font-size:14px}
.plan b{display:block;font-size:22px;font-weight:400;color:#2f86cc}
.plan-note{font-size:14px;line-height:1.6;color:var(--ink2);margin-top:10px}

.today{display:flex;align-items:center;gap:12px}
.today .ic{font-size:44px}
.today .tx{flex:1;font-size:15px;line-height:1.4}
.today .tx b{font-size:19px;font-weight:400;display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:12px 20px;font-size:17px;
  background:var(--pink);color:#fff;box-shadow:0 5px 0 #e56f9b;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #e56f9b}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #3f8fcf}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #4bb593}
.btn.yellow{background:var(--yellow);color:#6b5200;box-shadow:0 5px 0 #e3b941}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d5e3f1}
.btn.sm{padding:9px 14px;font-size:15px}

.bar{height:14px;background:#eef4fb;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8fd3ff,#ff9cc4);border-radius:99px;transition:width .4s}
.stat{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}

/* weeks */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.wk{background:#fff;border-radius:24px;padding:14px;text-align:left;box-shadow:var(--shadow);position:relative;transition:transform .1s;border:3px solid #fff}
.wk:active{transform:scale(.97)}
.wk.done{border-color:#ffd96a}
.wk .n{font-size:14px;color:#3f8fcf}
.wk .ic{font-size:34px;margin:4px 0}
.wk .th{font-size:15px;line-height:1.3;min-height:40px}
.wk .rg{font-size:12px;color:var(--ink2);margin:4px 0 8px}
.wk .bar{height:9px}
.wk .crown{position:absolute;right:12px;top:10px;font-size:20px}

/* days */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.day{background:#fff;border-radius:22px;padding:14px;text-align:left;box-shadow:var(--shadow);border:3px solid #fff}
.day.done{border-color:var(--mint)}
.day .dn{font-size:19px}
.day .dr{font-size:13px;color:var(--ink2)}
.day .pv{font-size:24px;margin:8px 0;letter-spacing:2px}
.day .ck{font-size:13px;color:#3aa67f}
.day.review{background:var(--yellow2)}
.day.rest{background:var(--pink2)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mode{border-radius:26px;padding:18px 12px;text-align:center;box-shadow:var(--shadow);background:#fff;border:3px solid #fff}
.mode .ic{font-size:44px}
.mode .mt{font-size:19px;margin-top:4px}
.mode .md{font-size:13px;color:var(--ink2);margin-top:3px}
.mode .st{margin-top:6px;font-size:15px;letter-spacing:2px}
.mode.m1{background:linear-gradient(180deg,#fff,#e2f2ff)}
.mode.m2{background:linear-gradient(180deg,#fff,#ffe6f0)}
.mode.m3{background:linear-gradient(180deg,#fff,#dcf8ef)}
.mode.m4{background:linear-gradient(180deg,#fff,#fff3cc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border-radius:999px;padding:6px 11px;font-size:14px;border:2px solid var(--line)}
.chip.k{border-color:var(--mint);background:var(--mint2)}

/* flash card */
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.7}
.dots i.on{background:var(--pink);opacity:1;transform:scale(1.25)}
.dots i.k{background:var(--mint);opacity:1}
.flipbox{perspective:1100px;width:min(360px,100%);height:380px;margin:8px auto 14px;cursor:pointer}
.flipin{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flipbox.on .flipin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:36px;background:#fff;
  box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border:5px solid #fff;text-align:center}
.face.f{background:radial-gradient(circle at 50% 35%,#fffdf5 0%,#fff 60%)}
.face.b{transform:rotateY(180deg);background:radial-gradient(circle at 50% 30%,#fff6fa 0%,#fff 65%)}
.pic{font-size:118px;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.08));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.word{font-size:46px;font-weight:700;margin-top:18px;color:#3f6fae;word-break:break-word;line-height:1.1}
.word.long{font-size:34px}
.hint{font-size:14px;color:#a7a0b8;margin-top:12px}
.ko{font-size:36px;margin-top:6px;line-height:1.25;word-break:keep-all}
.pos{display:inline-block;margin-top:10px;background:var(--yellow2);color:#9a7a10;border-radius:99px;padding:4px 12px;font-size:14px}
.small-en{font-size:22px;color:#3f6fae;margin-top:10px;font-weight:600}
.pic.sm{font-size:64px;animation:none}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.round{width:54px;height:54px;border-radius:50%;background:#fff;font-size:22px;box-shadow:var(--shadow)}
.round:active{transform:translateY(3px)}
.kbadge{display:inline-block;margin-left:6px;background:var(--mint2);color:#2e8f6c;border-radius:99px;padding:2px 10px;font-size:13px}

/* quiz */
.qcard{background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:22px;text-align:center;border:5px solid #fff;margin:6px 0 16px;position:relative}
.qcard .pic{font-size:120px}
.qcard .qpic{font-size:150px;margin:10px 0 6px}
.qko{font-size:38px;margin-top:12px;line-height:1.25;word-break:keep-all}
.qprompt{font-size:21px;color:var(--ink2);margin-bottom:8px}
.speakbig{width:130px;height:130px;border-radius:50%;background:linear-gradient(180deg,#ffd3e5,#ff9cc4);font-size:60px;box-shadow:0 7px 0 #e982ab;margin:10px auto}
.speakbig:active{transform:translateY(5px);box-shadow:0 2px 0 #e982ab}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch{background:#fff;border-radius:26px;padding:18px 8px;font-size:32px;word-break:break-word;line-height:1.15;box-shadow:0 5px 0 #d5e3f1,0 10px 20px rgba(70,130,190,.12);border:3px solid #fff;min-height:100px;transition:transform .08s}
.ch:active{transform:translateY(3px)}
.ch .en{font-weight:600;color:#3f6fae}
.ch .e{font-size:56px;display:block}
.ch.long{font-size:25px}
.ch.picch{min-height:150px;display:flex;align-items:center;justify-content:center}
.ch.picch .e{font-size:96px;line-height:1}
.ch .k{font-size:23px;display:block;margin-top:6px;word-break:keep-all}
.ch.right{background:var(--mint2);border-color:var(--mint);animation:pop .4s}
.ch.wrong{background:#ffe6ea;border-color:#ff9aa8;animation:shake .4s}
.ch:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.qhead .bar{flex:1}
.minicat{width:64px;flex:none}
.minicat svg{width:100%;display:block}
.score{font-size:22px;min-width:52px;text-align:right}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{min-width:0;overflow:hidden;background:#fff;border-radius:22px;min-height:110px;padding:8px;box-shadow:0 5px 0 #d5e3f1;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s,opacity .3s}
.tile .en{display:block;max-width:100%;white-space:normal;word-break:keep-all;overflow-wrap:normal;line-height:1.15;font-size:25px;font-weight:600;color:#3f6fae}
.tile .e{font-size:62px;line-height:1}
.tile .k{font-size:17px;color:var(--ink2);margin-top:2px}
.tile.sel{border-color:var(--pink);background:var(--pink2);transform:scale(1.04)}
.tile.ok{border-color:var(--mint);background:var(--mint2);opacity:.55;transform:scale(.94)}
.tile.no{animation:shake .4s;border-color:#ff9aa8}

/* result */
.result{text-align:center}
.result .catwrap{margin:0 auto;width:170px}
.stars{font-size:46px;letter-spacing:6px;margin:6px 0}
.result h3{font-size:28px;font-weight:400;margin:6px 0}
.wrongs{text-align:left;margin-top:12px}
.wl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#fff7fa;margin:6px 0}
.wl .e{font-size:36px}
.wl .en{font-weight:600;color:#3f6fae;font-size:26px}
.wl .k{color:var(--ink2);font-size:20px}

/* list */
table.wt{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:15px}
.wt td{background:#fff;padding:9px 8px}
.wt td:first-child{border-radius:14px 0 0 14px;color:var(--ink2);width:46px;text-align:center}
.wt td:last-child{border-radius:0 14px 14px 0;text-align:center;width:56px}
.wt .e{font-size:24px;width:40px;text-align:center}
.wt .en{font-weight:600;color:#3f6fae;cursor:pointer}
.wt .p{font-size:12px;color:#9a7a10}
.okbtn{width:38px;height:38px;border-radius:50%;border:3px dashed #d0dbe8;font-size:18px;color:#c4cfdc;background:#fff}
.okbtn.on{border:3px solid var(--mint);background:var(--mint2);color:#2e8f6c}

.foot{text-align:center;color:#6d8fb3;font-size:13px;margin-top:30px;line-height:1.7}
.link{color:#6d8fb3;text-decoration:underline;font-size:13px}

/* login */
.login{max-width:420px;margin:10px auto 0;text-align:center}
.login .catwrap{width:150px;margin:0 auto}
.login .title{margin-top:4px}
.lform{text-align:left;display:grid;gap:8px;margin-top:6px}
.lform label{font-size:16px;margin-top:6px}
.lform input{width:100%;min-width:0;font-family:inherit;font-size:20px;padding:13px 16px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink);outline:none}
.lform input:focus{border-color:var(--blue)}
.lform .btn{margin-top:12px;font-size:20px;padding:14px}
.lmsg{min-height:22px;color:#e2557f;font-size:16px;text-align:center;margin-top:4px}
.lnote{background:var(--yellow2);border-radius:16px;padding:12px;font-size:15px;line-height:1.5;color:#7a5d00}
.preview{font-size:13px;color:#6d8fb3;margin-top:14px;line-height:1.6}
/* user bar & sync */
.userbar{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.uchip{background:#fff;border-radius:999px;padding:7px 13px;font-size:15px;box-shadow:0 3px 0 #d5e3f1}
.uchip.sync{color:#3aa67f}
.uchip.sync.saving{color:#3f8fcf}
.uchip.sync.err{color:#e2557f;cursor:pointer}
.title .who{color:#fff}
/* stats */
.plan.st b{color:#ff7fab}
.streak{margin-top:10px;font-size:17px;text-align:center}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;margin-top:12px;padding:0 2px}
.week7 .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.week7 .n{font-size:14px;color:var(--ink2)}
.week7 .bb{width:70%;max-width:34px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#ffb3cf,#8fd3ff);min-height:4px}
.week7 .c.today .bb{background:linear-gradient(180deg,#ff7fab,#5fb0ef)}
.week7 .d{font-size:13px;color:var(--ink2)}
.week7 .c.today .d{color:#ff7fab}
.kinds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
/* copyright */
.copy{position:relative;z-index:1;text-align:center;padding:10px 16px 30px;font-family:'Jua',sans-serif;font-size:14px;color:#6a7fa6;letter-spacing:.2px}


/* confetti */
.cf{position:fixed;top:-40px;z-index:50;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}

/* cat */
.cat .blink{animation:blink 4s infinite;transform-origin:center 92px;transform-box:view-box}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.cat .paw{animation:wave 1.4s ease-in-out infinite;transform-origin:150px 168px;transform-box:view-box}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
.cat .tailw{animation:tail 2s ease-in-out infinite;transform-origin:150px 170px;transform-box:view-box}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-14px)}}

@media (max-width:480px){
  .title{font-size:28px}
  .catwrap{width:118px}
  .bubble{font-size:15px;margin-bottom:36px}
  .word{font-size:40px}
  .flipbox{height:350px}
  .ch{font-size:27px;padding:16px 6px}
  .ch.long{font-size:21px}
  .ch.picch{min-height:132px}
  .ch.picch .e{font-size:84px}
  .qko{font-size:32px}
  .qcard .pic{font-size:104px}
  .qcard .qpic{font-size:130px}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .tile{min-height:86px}
  .tile .en{font-size:26px}
  .tile .e{font-size:50px}
}
</style>
</head>
<body>
<div id="sky"></div>
<main id="app"></main>
<footer class="copy">Copyright © 2026 은하엄마. All rights reserved.</footer>

<script src="config.js"></script>
<script>
/* ============================================================
   필수 영어 단어 1,500 (순위 순서 · 100개씩 15그룹)
   형식: 영어|한글 뜻|품사(n 명사, v 동사, a 형용사, d 부사, f 기능어)|그림
   ============================================================ */
const RAW = `father|아빠|n|👨‍🍼
mother|엄마|n|👩‍🍼

ear|귀|n|👂

red|빨간|a|🔴

five|다섯|n|5️⃣
purple|보라색|n|🟣

eight|여덟|n|8️⃣
orange|오렌지|n|🍊
nine|아홉|n|9️⃣
strawberry|딸기|n|🍓
banana|바나나|n|🍌
ten|열(숫자 10)|n|🔟
grape|포도|n|🍇
dog|개|n|🐕
hello|안녕|f|👋
cat|고양이|n|🐱
goodbye|안녕히 가세요|f|👋+🚶
pig|돼지|n|🐖
chicken|닭|n|🐔
sorry|미안한|a|🙇
cow|소|n|🐄
please|제발|d|🙏
desk|책상|n|📚+🪑
book|책|n|📕
eraser|지우개|n|✏️+🧽
backpack|책가방|n|🎒
morning|아침|n|🌅
afternoon|오후|n|🌤️
evening|저녁|n|🌆
day|낮/날|n|☀️+📅

/* 기본 주소: config.js가 없거나 비어 있어도 이 주소로 연결돼요 */
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxHKF14EjLQoC15cH3ljLgoMgngjfjvCnOw_TdkMerRUb-EPt2xDi1rZ5nZHtaSBRVc/exec';
const API_URL = String(window.WORDSKY_API_URL||DEFAULT_API_URL).trim();

function packState(){ return JSON.stringify({known:Object.keys(S.known).map(Number),stars:S.stars,done:Object.keys(S.done)}); }
function unpackState(j){
  const o={known:{},stars:{},done:{}};
  try{ const p = typeof j==='string' ? JSON.parse(j||'{}') : (j||{});
    (p.known||[]).forEach(id=>o.known[id]=1); o.stars=p.stars||{}; (p.done||[]).forEach(k=>o.done[k]=1); }catch(e){}
  return o;
}
async function gas(fn,args){
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const timer = ctl ? setTimeout(()=>ctl.abort(),25000) : 0;
  try{
    /* text/plain 으로 보내야 구글이 막지 않아요 (CORS 사전 요청 없이 전송) */
    const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({fn,args}),redirect:'follow',signal:ctl?ctl.signal:undefined});
    const j = await r.json();
    if(j && j.error) throw new Error(j.error);
    return j ? j.data : null;
  } finally { clearTimeout(timer); }
}
function api(fn,...args){
  if(HAS_GAS) return gas(fn,args);
  try{ return Promise.resolve(LOCAL[fn](...args)); }catch(e){ return Promise.reject(e); }
}

/* ---- 미리보기 모드용: 구글 시트 대신 이 기기에 저장 ---- */
const LOCAL = (()=>{
  const K='wordsky-local-db';
  const db=()=>{ try{ return JSON.parse(localStorage.getItem(K))||{kids:{},logs:[]}; }catch(e){ return {kids:{},logs:[]}; } };
  const put=d=>{ try{ localStorage.setItem(K,JSON.stringify(d)); }catch(e){} };
  const h=(n,p)=>{ let x=5381; for(const c of n+'|'+p) x=((x<<5)+x+c.charCodeAt(0))|0; return String(x); };
  const auth=(d,n,t)=>{ const k=d.kids[n]; if(!k||k.token!==t) throw new Error('다시 로그인해 주세요'); return k; };
  const stats=(d,n)=>computeStats(d.logs.filter(l=>l.name===n).map(l=>({t:l.t,kind:l.kind})));
  return {
    login(name,pw,create){
      name=String(name||'').trim().slice(0,10); pw=String(pw||'');
      if(!name) return {ok:false,msg:'이름을 써 주세요'};
      if(pw.length<4) return {ok:false,msg:'비밀번호는 4자 이상이에요'};
      const d=db(); let k=d.kids[name];
      if(!k){ if(!create) return {ok:false,needCreate:true};
        k=d.kids[name]={hash:h(name,pw),token:Math.random().toString(36).slice(2),state:'{}'}; put(d); }
      else if(k.hash!==h(name,pw)) return {ok:false,msg:'비밀번호가 달라요'};
      return {ok:true,name,token:k.token,state:k.state,stats:stats(d,name)};
    },
    resume(name,token){ const d=db(), k=auth(d,name,token); return {ok:true,name,token,state:k.state,stats:stats(d,name)}; },
    saveState(name,token,json){ const d=db(); auth(d,name,token).state=json; put(d); return {ok:true}; },
    logStudy(name,token,e,json){ const d=db(); const k=auth(d,name,token); k.state=json;
      d.logs.push({t:Date.now(),name,kind:e.kind}); put(d); return stats(d,name); }
  };
})();

/* 공부 기록 → 오늘/7일/전체/연속 (서버의 Code.gs와 같은 규칙) */
function ymd(d){ d=new Date(d); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function computeStats(logs){
  const byDay={}, kinds={};
  logs.forEach(l=>{ const k=ymd(l.t); byDay[k]=(byDay[k]||0)+1; kinds[l.kind]=(kinds[l.kind]||0)+1; });
  const now=Date.now(), days=[]; let week=0;
  for(let i=6;i>=0;i--){ const dt=new Date(now-i*864e5), key=ymd(dt), n=byDay[key]||0; week+=n;
    days.push({key,label:(dt.getMonth()+1)+'/'+dt.getDate(),dow:'일월화수목금토'[dt.getDay()],n}); }
  let streak=0, t=now; if(!byDay[ymd(t)]) t-=864e5;
  while(byDay[ymd(t)]){ streak++; t-=864e5; }
  return {today:byDay[ymd(now)]||0,week,total:logs.length,streak,days,kinds};
}

let saveTimer=null, syncMode='ok';
function setSync(m){
  syncMode=m; const el=document.getElementById('sync'); if(!el) return;
  el.className='uchip sync '+(m==='ok'?'':m);
  el.textContent = m==='saving'?'☁️ 저장 중…':m==='err'?'⚠️ 저장 안 됨 · 다시':(HAS_GAS?'✅ 저장됨':'💾 이 기기');
}
function onApiErr(err){
  const msg=String(err&&err.message||err);
  if(/다시 로그인/.test(msg)){ logout('다시 로그인해 주세요'); return; }
  setSync('err');
}
function cacheLocal(){ try{ if(ME) localStorage.setItem('wordsky-cache-'+ME.name,packState()); }catch(e){} }
function save(){ cacheLocal(); clearTimeout(saveTimer); saveTimer=setTimeout(pushState,1200); }
function pushState(){
  if(!ME) return; setSync('saving');
  api('saveState',ME.name,ME.token,packState()).then(()=>setSync('ok')).catch(onApiErr);
}
/* 공부 1번 기록 (카드 끝까지, 퀴즈·짝맞추기·복습을 마칠 때마다) */
function record(type,key,score,total,stars){
  if(!ME) return;
  const m=/^w(\d+)d(\d+)/.exec(key||'')||[];
  const entry={kind:KIND[type]||type,week:+m[1]||'',day:+m[2]||'',score:score==null?'':score,total:total==null?'':total,stars:stars==null?'':stars};
  if(STATS){ if(!STATS.today) STATS.streak++; STATS.today++; STATS.week++; STATS.total++;

let voice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Samantha|Google US|Aria|Jenny|Zira|Female/i.test(v.name))
         || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){}
}

function say(t){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=.78; u.pitch=1.1; if(voice) u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
let ac;
function tone(fs,dur,type){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = ac.currentTime;
    fs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain(), t=t0+i*dur;
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.03);
    });
  }catch(e){}
}

      <button class="btn mint" id="ok">😺 알아요!</button>
    </div>
    <div style="text-align:center;font-size:14px" class="muted">${S.known[x.id]?'<span class="kbadge">✔ 아는 단어</span>':'카드를 누르면 뒤집혀요 · 옆으로 밀어도 넘어가요'}</div>`);
    const fb=document.getElementById('fb');
    fb.onclick=()=>{ flipped=!flipped; fb.classList.toggle('on',flipped); if(flipped) say(x.en); };
    document.getElementById('bk').onclick=back;
    document.getElementById('sp').onclick=()=>say(x.en);
    document.getElementById('pv').onclick=()=>go(-1);
    document.getElementById('nx').onclick=()=>go(1);
    document.getElementById('ok').onclick=()=>{ S.known[x.id]=1; save(); ding(); go(1); };
    document.getElementById('no').onclick=()=>{ delete S.known[x.id]; save(); go(1); };
    let sx=null;
    fb.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
    fb.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>60){ e.preventDefault(); go(dx<0?1:-1);} sx=null; });
    setTimeout(()=>say(x.en),250);
  }
  function go(step){
    if(i+step>=list.length){ return finish(); }
    i=Math.max(0,i+step); flipped=false; draw();
  }
  function finish(){
    if(!customList){ S.done[`w${w}d${d}`]=1; }
    record(customList?'rest':'card',`w${w}d${customList?7:d}`,knownIn(list),list.length,'');
    fanfare(); confetti();
    render(`<div class="panel result">
      <div class="catwrap">${cat('happy')}</div>
      <h3>카드 학습 완료!</h3>
      <p class="muted">${list.length}개 중 <b style="font-weight:400;color:#2e8f6c">${knownIn(list)}개</b>를 알고 있어요.<br>이제 퀴즈로 확인해 볼까냥?</p>
      <div class="ctrl">${customList?'':`<button class="btn" onclick="quiz(${w},${d},'pic')">🖼️ 그림 퀴즈 하러 가기</button>`}
      <button class="btn white" id="bk2">돌아가기</button></div></div>`);
    document.getElementById('bk2').onclick=back;
  }
  draw();
}
function restCards(w){
  const list=weekWords(w).filter(x=>!S.known[x.id]);
  cards(w,0,list,`${w}주차 · 모르는 단어`,()=>openWeek(w));
}

/* ================= 퀴즈 ================= */
function distractors(q,k){
  let pool=weekWords(q.week).filter(x=>x.id!==q.id && x.en!==q.en && x.ko!==q.ko && x.e!==q.e);
  if(pool.length<k) pool=WORDS.filter(x=>x.id!==q.id && x.ko!==q.ko);
  /* 그림이 서로 겹치지 않게 고르기 (듣기 퀴즈에서 그림만 보고 고를 수 있도록) */
  const seen=new Set([q.e]), out=[];
  for(const x of shuffle(pool)){ if(!seen.has(x.e)){ seen.add(x.e); out.push(x); if(out.length===k) break; } }
  return out;
}
function quiz(w,d,mode){ runQuiz(dayWords(w,d),mode,`w${w}d${d}-${mode}`,10,()=>openDay(w,d),
  mode==='pic'?`Day ${d} 그림 퀴즈`:`Day ${d} 듣기 퀴즈`, ()=>{S.done[`w${w}d${d}`]=1;}); }
function startReview(w){ runQuiz(weekWords(w),'mix',`w${w}d6-review`,20,()=>openWeek(w),`${w}주차 복습 퀴즈`,()=>{S.done[`w${w}d6`]=1;}); }

function runQuiz(list,mode,key,n,back,title,onDone){
  const qs=shuffle(list).slice(0,Math.min(n,list.length));
  let i=0, score=0; const wrong=[];
  function draw(){
    const q=qs[i], m = mode==='mix' ? (i%2?'listen':'pic') : mode;
    const opts=shuffle([q,...distractors(q,3)]);
    const top = m==='pic'
      ? `<div class="qprompt">이 그림은 영어로 뭘까?</div><div class="pic qpic">${E(q)}</div>`
      : `<div class="qprompt">잘 듣고 알맞은 그림을 골라요!</div><button class="speakbig" id="sp">🔊</button><div class="muted" style="font-size:18px">버튼을 누르면 다시 들려요</div>`;
    const choices = opts.map(o=> m==='pic'
      ? `<button class="ch ${o.en.length>8?'long':''}" data-id="${o.id}"><span class="en">${esc(o.en)}</span></button>`
      : `<button class="ch picch" data-id="${o.id}" aria-label="${esc(o.ko)}"><span class="e">${E(o)}</span></button>`).join('');
    render(`
    <div class="topbar"><button class="back" id="bk">◀ 나가기</button><div class="t">${title}</div><div class="r">${i+1} / ${qs.length}</div></div>
    <div class="qhead"><div class="minicat" id="mc">${cat('hi')}</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="score">⭐ ${score}</div></div>
    <div class="qcard">${top}</div>
    <div class="choices">${choices}</div>`);
    document.getElementById('bk').onclick=back;
    if(m==='listen'){ document.getElementById('sp').onclick=()=>say(q.en); setTimeout(()=>say(q.en),300); }
    app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>pick(b,q));
  }
  function pick(b,q){
    const ok = +b.dataset.id===q.id;
    app.querySelectorAll('.ch').forEach(x=>{ x.disabled=true; if(+x.dataset.id===q.id) x.classList.add('right'); });
    const mc=document.getElementById('mc');
    if(ok){ score++; ding(); b.classList.add('right'); }
    else { boo(); b.classList.add('wrong'); wrong.push(q); }
    mc.innerHTML=cat(ok?'happy':'sad'); mc.classList.add('hop');
    say(q.en);
    setTimeout(()=>{ i++; i<qs.length?draw():finish(); }, ok?1000:1700);
  }
  function finish(){
    const pct=score/qs.length, st=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
    if(st>(S.stars[key]||0)) S.stars[key]=st; if(onDone) onDone();
    record(key.split('-')[1],key,score,qs.length,st);
    if(st>=2){ fanfare(); confetti(); }
    const msg = st===3?'완벽해! 최고야!':st===2?'아주 잘했어!':st===1?'좋아, 조금만 더!':'괜찮아, 다시 해보자냥!';
    render(`<div class="panel result">
      <div class="catwrap">${cat(st>=1?'happy':'sad')}</div>
      <div class="stars">${starStr(st)}</div>
      <h3>${msg}</h3>
      <p class="muted">${qs.length}문제 중 ${score}개 정답</p>
      ${wrong.length?`<div class="wrongs"><div style="font-size:17px">🔁 다시 볼 단어</div>
        ${wrong.map(x=>`<div class="wl" onclick="say('${x.en.replace(/'/g,"\\'")}')"><span class="e">${E(x)}</span><div><div class="en">${esc(x.en)} 🔊</div><div class="k">${esc(x.ko)}</div></div></div>`).join('')}</div>`:''}
      <div class="ctrl" style="margin-top:16px"><button class="btn" id="re">다시 하기</button><button class="btn white" id="bk2">돌아가기</button></div></div>`);
    document.getElementById('re').onclick=()=>runQuiz(list,mode,key,n,back,title,onDone);
    document.getElementById('bk2').onclick=back;
  }
  draw();
}

/* ================= 짝 맞추기 ================= */
function match(w,d){
  const back=()=>openDay(w,d), key=`w${w}d${d}-match`;
  /* 그림이 서로 다른 단어 6개 고르기 (한글 없이 그림만으로 짝을 찾을 수 있도록) */
  const seen=new Set(), set=[];
  for(const x of shuffle(dayWords(w,d))){ if(!seen.has(x.e)){ seen.add(x.e); set.push(x); if(set.length===6) break; } }
  const tiles=shuffle([...set.map(x=>({x,t:'en'})),...set.map(x=>({x,t:'pic'}))]);
  let sel=null, got=0, miss=0;
  render(`
  <div class="topbar"><button class="back" id="bk">◀ 나가기</button><div class="t">짝 맞추기</div><div class="r" id="mm">0 / 6</div></div>
  <div class="qhead"><div class="minicat" id="mc">${cat('hi')}</div><div class="muted" style="flex:1;font-size:15px">영어 단어와 그림을 하나씩 눌러서 짝을 지어 줘!</div></div>
  <div class="mgrid">${tiles.map((o,i)=>`<button class="tile" data-i="${i}">${o.t==='en'
      ? `<span class="en">${esc(o.x.en)}</span>`
      : `<span class="e">${E(o.x)}</span>`}</button>`).join('')}</div>`);
  document.getElementById('bk').onclick=back;
  const els=[...app.querySelectorAll('.tile')];
  fitTiles(); setTimeout(fitTiles,600);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitTiles);
  els.forEach(el=>el.onclick=()=>{
    const o=tiles[+el.dataset.i];
    if(el.classList.contains('ok')) return;
    if(o.t==='en') say(o.x.en);
    if(sel===null || tiles[sel].t===o.t){ if(sel!==null) els[sel].classList.remove('sel'); sel=+el.dataset.i; el.classList.add('sel'); return; }
    const a=els[sel], ao=tiles[sel]; sel=null; a.classList.remove('sel');
    const mc=document.getElementById('mc');
    if(ao.x.id===o.x.id){
      a.classList.add('ok'); el.classList.add('ok'); got++; ding(); say(o.x.en);
      mc.innerHTML=cat('happy');
      document.getElementById('mm').textContent=`${got} / 6`;
      if(got===6) setTimeout(()=>{
        const st=miss<=1?3:miss<=4?2:1; if(st>(S.stars[key]||0)) S.stars[key]=st; S.done[`w${w}d${d}`]=1;
        record('match',key,6,6+miss,st); fanfare(); confetti();
        render(`<div class="panel result"><div class="catwrap">${cat('happy')}</div><div class="stars">${starStr(st)}</div>
          <h3>짝을 모두 찾았어!</h3><p class="muted">틀린 횟수 ${miss}번</p>
          <div class="ctrl"><button class="btn" onclick="match(${w},${d})">다른 단어로 또 하기</button><button class="btn white" onclick="openDay(${w},${d})">돌아가기</button></div></div>`);
      },700);
    }else{
      miss++; boo(); mc.innerHTML=cat('sad');
      [a,el].forEach(t=>{ t.classList.add('no'); setTimeout(()=>t.classList.remove('no'),420); });
    }
  });
}

/* 영어 단어가 칸 안에 한 줄로 쏙 들어가도록 글자 크기 자동 조절 */
function fitTiles(){
  app.querySelectorAll('.tile .en').forEach(s=>{
    s.style.fontSize='';
    const max=s.parentElement.clientWidth-14;
    let fs=parseFloat(getComputedStyle(s).fontSize);
    while((s.scrollWidth>max || s.offsetHeight>fs*1.2*2+2) && fs>12){ fs-=1; s.style.fontSize=fs+'px'; }
  });
}
window.addEventListener('resize',()=>{ if(app.querySelector('.mgrid')) fitTiles(); });

/* ================= 단어장 ================= */
function wordList(w){
  const ww=weekWords(w);
  render(`
  <div class="topbar"><button class="back" onclick="openWeek(${w})">◀ ${w}주차</button><div class="t">📋 ${w}주차 단어장</div><div class="r" id="cnt">${knownIn(ww)}/100</div></div>
  <p class="muted" style="font-size:14px;margin:0 4px">영어 단어를 누르면 발음이 나와요. 아는 단어는 오른쪽 동그라미를 눌러 O 표시!</p>
  <table class="wt">${ww.map(x=>`<tr>
    <td>${x.id}</td><td class="e">${E(x)}</td>
    <td><span class="en" data-say="${esc(x.en)}">${esc(x.en)}</span><br><span class="p">${x.pos}</span></td>
    <td>${esc(x.ko)}</td>
    <td><button class="okbtn ${S.known[x.id]?'on':''}" data-id="${x.id}">O</button></td></tr>`).join('')}</table>`);
  app.querySelectorAll('[data-say]').forEach(el=>el.onclick=()=>say(el.dataset.say));
  app.querySelectorAll('.okbtn').forEach(b=>b.onclick=()=>{
    const id=+b.dataset.id;
    if(S.known[id]) delete S.known[id]; else { S.known[id]=1; ding(); }
    b.classList.toggle('on',!!S.known[id]); save();
    document.getElementById('cnt').textContent=`${knownIn(ww)}/100`;
  });
}

/* ================= 로그인 ================= */
function showLogin(msg){
  ME=null;
  render(`<div class="login">
    <div class="catwrap">${cat('hi')}</div>
    <h1 class="title">단어 연습장</h1>
    <div class="subtitle">아이 이름과 비밀번호로 들어와요</div>
    <section class="panel">
      <form class="lform" id="lf" autocomplete="on" onsubmit="return false">
        <label for="ln">👧 아이 이름</label>
        <input id="ln" maxlength="10" autocomplete="username" placeholder="예) 은하">
        <label for="lp">🔒 비밀번호</label>
        <input id="lp" type="password" autocomplete="current-password" placeholder="4자 이상">
        <div id="newbox" hidden style="display:grid;gap:8px">
          <div class="lnote" id="newmsg"></div>
          <label for="lp2">🔒 비밀번호 한 번 더</label>
          <input id="lp2" type="password" autocomplete="new-password" placeholder="같은 비밀번호">
        </div>
        <button class="btn" id="lgo">들어가기</button>
        <button class="btn white" id="lcancel" hidden>다른 이름으로 할래요</button>
        <div class="lmsg" id="lmsg">${msg?esc(msg):''}</div>
      </form>
    </section>
    ${HAS_GAS?'':'<div class="preview">지금은 <b style="font-weight:400">미리보기 모드</b>예요. 기록이 이 기기에만 저장돼요.<br>구글 시트에 저장하려면 config.js에 Apps Script 주소를 넣어 주세요.</div>'}
  </div>`);
  const nb=document.getElementById('newbox'), go=document.getElementById('lgo'), cc=document.getElementById('lcancel'), lm=document.getElementById('lmsg');
  let creating=false;
  nb.style.display='none';
  cc.style.display='none';
  const setCreate=on=>{ creating=on; nb.hidden=!on; nb.style.display=on?'grid':'none'; cc.hidden=!on; cc.style.display=on?'':'none';
    go.textContent=on?'새로 만들고 들어가기':'들어가기'; if(on) document.getElementById('lp2').focus(); };
  cc.onclick=()=>{ setCreate(false); lm.textContent=''; document.getElementById('ln').focus(); };
  document.getElementById('ln').oninput=()=>{ if(creating) setCreate(false); };
  go.onclick=async()=>{
    const n=document.getElementById('ln').value.trim(), p=document.getElementById('lp').value;
    if(!n){ lm.textContent='이름을 써 주세요'; return; }
    if(p.length<4){ lm.textContent='비밀번호는 4자 이상이에요'; return; }
    if(creating && p!==document.getElementById('lp2').value){ lm.textContent='비밀번호가 서로 달라요'; return; }
    go.disabled=true; lm.textContent='☁️ 확인하는 중…';
    try{
      const r=await api('login',n,p,creating);
      go.disabled=false;
      if(r.ok) return enter(r);
      if(r.needCreate){ lm.textContent=''; document.getElementById('newmsg').innerHTML=`<b style="font-weight:400">'${esc(n)}'</b>는 처음 보는 이름이에요.<br>이 이름과 비밀번호로 새로 만들까요?`; setCreate(true); return; }
      lm.textContent=r.msg||'다시 해 볼까요?';
    }catch(e){ go.disabled=false; lm.textContent='연결이 잠깐 안 됐어요. 다시 눌러 주세요.'; }
  };
  ['ln','lp','lp2'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); go.click(); } }));
  document.getElementById('ln').focus();
}
function enter(r){
  ME={name:r.name,token:r.token};
  S=unpackState(r.state); STATS=r.stats||null; syncMode='ok';
  try{ localStorage.setItem(SESSKEY,JSON.stringify(ME)); }catch(e){}
  document.title=r.name+'의 단어 연습장';
  home();
}
function logout(msg){
  if(!msg && !confirm('로그아웃할까요?')) return;
  clearTimeout(saveTimer);
  try{ localStorage.removeItem(SESSKEY); }catch(e){}
  document.title='단어 연습장';
  showLogin(msg||'');
}
async function boot(){
  let sess=null; try{ sess=JSON.parse(localStorage.getItem(SESSKEY)||'null'); }catch(e){}
  if(sess && sess.name && sess.token){
    render(`<div class="login"><div class="catwrap">${cat('hi')}</div><h1 class="title">단어 연습장</h1><div class="subtitle">☁️ ${esc(sess.name)}의 기록을 불러오는 중…</div></div>`);
    try{ const r=await api('resume',sess.name,sess.token); if(r && r.ok) return enter(r); }
    catch(e){ const m=String(e&&e.message||e); return showLogin(/다시 로그인/.test(m)?'':'연결이 잠깐 안 됐어요. 다시 들어와 주세요.'); }
  }
  showLogin();
}
boot();
</script>
